name: "SonarQube Cloud Scan"
on:
  workflow_call:
    inputs:
      project_key:
        required: true
        type: string
      host_url:
        type: string
        default: https://sc-staging.io
      organization:
        type: string
        default: sonarsource-cs-apj-anz
    secrets:
      SONAR_TOKEN:
        required: true
jobs:
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - name: Cache SonarQube packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ inputs.host_url }}
        with:
          args: >
            -Dsonar.projectKey=${{ inputs.project_key }}
            -Dsonar.organization=${{ inputs.organization }}
